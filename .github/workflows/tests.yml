name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb
          coverage: xdebug

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_TOKEN }}"}}'
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Save vendor folder
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor
          compression-level: 0
          retention-days: 1

  static-analysis:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPStan
        run: composer phpstan

  lint:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHP CS Fixer
        run: composer lint

  audit:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run Composer audit
        run: composer audit

  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: event_sourcing_test
    steps:
      # A service container cannot pass a command to its image, so mongod cannot
      # be started with --replSet there. MongoDB has required a replica set for
      # multi-document transactions since 4.0 and still does, so a standalone
      # confines MongoDbEventStorage to its non-atomic fallback path.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_DATABASE=event_sourcing_test \
            mongo:8.3 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval 'rs.status().ok' && break
            sleep 2
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPUnit
        run: composer test

  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        mongo-tag: ['8.0', '8.3']
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: event_sourcing_test
    steps:
      # A service container cannot pass a command to its image, so mongod cannot
      # be started with --replSet there. MongoDB has required a replica set for
      # multi-document transactions since 4.0 and still does, so a standalone
      # confines MongoDbEventStorage to its non-atomic fallback path.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_DATABASE=event_sourcing_test \
            mongo:${{ matrix.mongo-tag }} --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval 'rs.status().ok' && break
            sleep 2
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPUnit Integration tests
        run: composer test-integration

  standalone-tests:
    # The compensating fallback path is a supported deployment mode, and every
    # other job runs against a replica set — so without this one nothing ever
    # exercises a real standalone. Cases that genuinely require transactions
    # are marked #[Group('replicaset')] and excluded here.
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    services:
      mongodb:
        image: mongo:8.3
        env:
          MONGO_INITDB_DATABASE: event_sourcing_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: event_sourcing_test
      # A standalone mongod cannot roll a failed call back, so since `V1-1`
      # MongoDbEventStorage refuses to write against one until the operator
      # says they accept that. This job is that operator: it opts out here, in
      # the same explicit way a production deployment would.
      MONGO_ALLOW_NON_ATOMIC_BATCHES: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run PHPUnit against a standalone mongod
        run: composer test-standalone

  code-coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: event_sourcing_test
    steps:
      # A service container cannot pass a command to its image, so mongod cannot
      # be started with --replSet there. MongoDB has required a replica set for
      # multi-document transactions since 4.0 and still does, so a standalone
      # confines MongoDbEventStorage to its non-atomic fallback path.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_DATABASE=event_sourcing_test \
            mongo:8.3 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval 'rs.status().ok' && break
            sleep 2
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring, mongodb

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run code coverage
        run: composer code-coverage

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.php-version }}
          path: build/coverage
          retention-days: 5
